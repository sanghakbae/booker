name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Content lives in Firestore, so a rebuild is how published manuals reach the
  # static HTML that crawlers see. Trigger it by hand or on a schedule.
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST daily

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reads the published manuals over the Firestore REST API and prerenders
      # them, so the deployed HTML contains real content.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
